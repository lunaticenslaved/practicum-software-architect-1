openapi: 3.0.3
info:
  title: Sersors Service
  description: Microservice for managing sensor data with domain-driven design
  version: 1.0.0
  contact:
    name: Sensors Service Team

servers:
  - url: http://localhost:8083
    description: Local development server

tags:
  - name: sensors
    description: Sensor management operations
  - name: health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Check if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: string
                example: Ready!

  /sensors:
    get:
      tags:
        - sensors
      summary: List all sensors
      description: Retrieve a list of all registered sensors
      operationId: listSensors
      responses:
        '200':
          description: List of sensors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'

    post:
      tags:
        - sensors
      summary: Register a new sensor
      description: Create a new sensor in the system
      operationId: registerSensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '200':
          description: Sensor registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}:
    get:
      tags:
        - sensors
      summary: Get sensor by ID
      description: Retrieve a specific sensor by its ID
      operationId: getSensorById
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: string
      responses:
        '200':
          description: Sensor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid sensor ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - sensors
      summary: Update sensor
      description: Update sensor information
      operationId: updateSensor
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdate'
      responses:
        '200':
          description: Sensor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - sensors
      summary: Delete sensor
      description: Remove a sensor from the system
      operationId: deleteSensor
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: string
      responses:
        '200':
          description: Sensor deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sensor deleted successfully
        '400':
          description: Invalid sensor ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}/value:
    patch:
      tags:
        - sensors
      summary: Update sensor value
      description: Update the current value and status of a sensor
      operationId: updateSensorValue
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorValueUpdate'
      responses:
        '200':
          description: Sensor value updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Sensor:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Living Room Temperature
        type:
          type: string
          example: temperature
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 22.5
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active
        lastUpdated:
          type: string
          format: date-time
          example: 2026-03-06T08:00:00Z

    SensorCreate:
      type: object
      required:
        - name
        - type
        - location
        - value
        - unit
        - status
      properties:
        name:
          type: string
          example: Living Room Temperature
        type:
          type: string
          example: temperature
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 22.5
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active

    SensorUpdate:
      type: object
      properties:
        name:
          type: string
          example: Living Room Temperature Sensor
        type:
          type: string
          example: temperature
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 23.0
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active

    SensorValueUpdate:
      type: object
      required:
        - value
        - status
      properties:
        value:
          type: number
          format: float
          example: 23.5
        status:
          type: string
          example: active

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: Error message
