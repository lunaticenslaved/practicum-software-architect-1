version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarthome
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network


  ms-sensors:
    build:
      context: ./ms-sensors
      dockerfile: Dockerfile
    container_name: smarthome-ms-sensors
    environment:
      - PORT=8080
      - TELEMETRY_SERVICE_URL=http://ms-telemetry:8080
    restart: unless-stopped
    networks:
      - smarthome-network

  ms-telemetry:
    build:
      context: ./ms-telemetry
      dockerfile: Dockerfile
    container_name: smarthome-ms-telemetry
    environment:
      - PORT=8080
      - TEMPERATURE_API_URL=http://temperature-api:8080
    restart: unless-stopped

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8080
      - MS_TELEMETRY_URL=http://ms-telemetry:8080
      - MS_SENSORS_URL=http://ms-sensors:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

    
volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
