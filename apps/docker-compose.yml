version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432" 
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql

  ms-sensors:
    build:
      context: ./ms-sensors
      dockerfile: Dockerfile
    container_name: ms-sensors
    environment:
      - PORT=8080
      - TELEMETRY_SERVICE_URL=http://ms-telemetry:8082
    ports:
      - "8083:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  ms-telemetry:
    build:
      context: ./ms-telemetry
      dockerfile: Dockerfile
    container_name: ms-telemetry
    environment:
      - PORT=8080
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - MS_TELEMETRY_URL=http://ms-telemetry:8082
      - MS_SENSORS_URL=http://ms-sensors:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
      

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge