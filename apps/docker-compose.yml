version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarthome
    ports:
      - "6432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  ms-sensors:
    build:
      context: ./ms-sensors
      dockerfile: Dockerfile
    container_name: smarthome-ms-sensors
    environment:
      - PORT=8080
      - TELEMETRY_SERVICE_URL=http://ms-telemetry:8080
    ports:
      - "8083:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  ms-telemetry:
    build:
      context: ./ms-telemetry
      dockerfile: Dockerfile
    container_name: smarthome-ms-telemetry
    environment:
      - PORT=8080
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: smarthome-temperature-api
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - MS_TELEMETRY_URL=http://ms-telemetry:8080
      - MS_SENSORS_URL=http://ms-sensors:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
    
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: smarthome-swagger-ui
    environment:
      - URLS=[{"url":"http://localhost:9090/openapi/smart-home.yaml","name":"Smart Home API"},{"url":"http://localhost:9090/openapi/ms-sensors.yaml","name":"MS-Sensors API"},{"url":"http://localhost:9090/openapi/ms-telemetry.yaml","name":"MS-Telemetry API"},{"url":"http://localhost:9090/openapi/temperature.yaml","name":"Temperature API"}]
      - URLS_PRIMARY_NAME=Smart Home API
    ports:
      - "9090:8080"
    volumes:
      - ../docs/openapi:/usr/share/nginx/html/openapi:ro
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
