openapi: 3.0.3
info:
  title: MS-Telemetry API
  description: Microservice for telemetry data aggregation and temperature monitoring
  version: 1.0.0
  contact:
    name: MS-Telemetry Team

servers:
  - url: http://localhost:8082
    description: Local development server

tags:
  - name: temperature
    description: Temperature data operations
  - name: health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Check if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: string
                example: Ready!

  /temperature:
    get:
      tags:
        - temperature
      summary: Get temperature by location
      description: Retrieve temperature data for a specific location
      operationId: getTemperatureByLocation
      parameters:
        - name: location
          in: query
          required: true
          description: Location name
          schema:
            type: string
            example: Living Room
      responses:
        '200':
          description: Temperature data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureData'
        '400':
          description: Location not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /temperature/{id}:
    get:
      tags:
        - temperature
      summary: Get temperature by sensor ID
      description: Retrieve temperature data for a specific sensor
      operationId: getTemperatureBySensorId
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Temperature data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureData'
        '400':
          description: Sensor ID not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    TemperatureData:
      type: object
      properties:
        value:
          type: number
          format: float
          example: 22.5
        unit:
          type: string
          example: °C
        timestamp:
          type: string
          format: date-time
          example: 2026-03-06T08:00:00Z
        location:
          type: string
          example: Living Room
        status:
          type: string
          example: active
        sensor_id:
          type: string
          example: "1"
        sensor_type:
          type: string
          example: temperature
        description:
          type: string
          example: Temperature sensor in Living Room

    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message
