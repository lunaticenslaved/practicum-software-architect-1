openapi: 3.0.3
info:
  title: Smart Home API
  description: Main API for managing smart home sensors and their data
  version: 1.0.0
  contact:
    name: Smart Home Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: sensors
    description: Sensor management operations
  - name: health
    description: Health check endpoints

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Check if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /sensors:
    get:
      tags:
        - sensors
      summary: Get all sensors
      description: Retrieve a list of all sensors with their current values
      operationId: getSensors
      responses:
        '200':
          description: List of sensors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - sensors
      summary: Create a new sensor
      description: Register a new sensor in the system
      operationId: createSensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '201':
          description: Sensor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}:
    get:
      tags:
        - sensors
      summary: Get sensor by ID
      description: Retrieve a specific sensor by its ID
      operationId: getSensorById
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sensor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid sensor ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sensor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - sensors
      summary: Update sensor
      description: Update sensor information
      operationId: updateSensor
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdate'
      responses:
        '200':
          description: Sensor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - sensors
      summary: Delete sensor
      description: Remove a sensor from the system
      operationId: deleteSensor
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sensor deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sensor deleted successfully
        '400':
          description: Invalid sensor ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}/value:
    patch:
      tags:
        - sensors
      summary: Update sensor value
      description: Update the current value and status of a sensor
      operationId: updateSensorValue
      parameters:
        - name: id
          in: path
          required: true
          description: Sensor ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorValueUpdate'
      responses:
        '200':
          description: Sensor value updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sensor value updated successfully
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/temperature/{location}:
    get:
      tags:
        - sensors
      summary: Get temperature by location
      description: Retrieve temperature data for a specific location
      operationId: getTemperatureByLocation
      parameters:
        - name: location
          in: path
          required: true
          description: Location name
          schema:
            type: string
            example: Living Room
      responses:
        '200':
          description: Temperature data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureData'
        '400':
          description: Location is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Sensor:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Living Room Temperature
        type:
          type: string
          enum: [temperature, humidity, motion, light]
          example: temperature
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 22.5
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active
        last_updated:
          type: string
          format: date-time
          example: 2026-03-06T08:00:00Z
        created_at:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00Z

    SensorCreate:
      type: object
      required:
        - name
        - type
        - location
        - unit
      properties:
        name:
          type: string
          example: Living Room Temperature
        type:
          type: string
          enum: [temperature, humidity, motion, light]
          example: temperature
        location:
          type: string
          example: Living Room
        unit:
          type: string
          example: °C

    SensorUpdate:
      type: object
      properties:
        name:
          type: string
          example: Living Room Temperature Sensor
        type:
          type: string
          enum: [temperature, humidity, motion, light]
          example: temperature
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 23.0
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active

    SensorValueUpdate:
      type: object
      required:
        - value
        - status
      properties:
        value:
          type: number
          format: float
          example: 23.5
        status:
          type: string
          example: active

    TemperatureData:
      type: object
      properties:
        location:
          type: string
          example: Living Room
        value:
          type: number
          format: float
          example: 22.5
        unit:
          type: string
          example: °C
        status:
          type: string
          example: active
        timestamp:
          type: string
          format: date-time
          example: 2026-03-06T08:00:00Z
        description:
          type: string
          example: Temperature sensor in Living Room

    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message
